<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23070235'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23c9a227' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='14' r='4' fill='%23d9b93f'/%3E%3Cpath d='M8 22 L12 16 L15 19 L19 13 L24 22 Z' fill='%232170e4'/%3E%3C/svg%3E" />
    <meta name="description" content="Government Human Resource Information System — Republic of the Philippines. Employee administration, timekeeping, payroll, leave, and recruitment for government agencies." />
    <title>Government HRIS — Republic of the Philippines</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; background: #f8f9ff; color: #0b1c30; }
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #070235; z-index: 999; transition: opacity .4s ease; }
      #boot.done { opacity: 0; pointer-events: none; }
      #boot .seal { width: 84px; height: 84px; border-radius: 50%; border: 2px solid #c9a227; box-shadow: 0 0 0 6px rgba(201,162,39,.12), 0 18px 50px rgba(0,0,0,.45); animation: sealPulse 1.6s ease-in-out infinite; }
      #boot .t1 { font-family: Georgia, 'Times New Roman', serif; font-size: 13px; letter-spacing: .34em; text-transform: uppercase; color: #c9a227; }
      #boot .t2 { font-family: Georgia, serif; font-size: 22px; color: #fff; margin-top: -10px; }
      #boot .bar { width: 190px; height: 2px; background: rgba(255,255,255,.12); overflow: hidden; border-radius: 2px; }
      #boot .bar i { display: block; height: 100%; width: 40%; background: linear-gradient(90deg, #c9a227, #2170e4); animation: load 1.1s ease-in-out infinite; }
      @keyframes load { 0% { transform: translateX(-110%);} 100% { transform: translateX(300%);} }
      @keyframes sealPulse { 0%,100% { transform: scale(1);} 50% { transform: scale(1.04);} }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <svg class="seal" viewBox="0 0 96 96" aria-label="Government HRIS seal">
          <defs>
            <radialGradient id="g" cx="50%" cy="42%" r="65%">
              <stop offset="0%" stop-color="#171268"/><stop offset="100%" stop-color="#050126"/>
            </radialGradient>
          </defs>
          <circle cx="48" cy="48" r="46" fill="url(#g)" stroke="#c9a227" stroke-width="2.5"/>
          <circle cx="48" cy="48" r="38" fill="none" stroke="#c9a227" stroke-width="1" opacity=".7"/>
          <circle cx="48" cy="40" r="11" fill="#d9b93f"/>
          <g stroke="#d9b93f" stroke-width="2" stroke-linecap="round">
            <line x1="48" y1="20" x2="48" y2="25"/><line x1="34" y1="26" x2="37" y2="30"/><line x1="62" y1="26" x2="59" y2="30"/>
            <line x1="28" y1="40" x2="33" y2="40"/><line x1="68" y1="40" x2="63" y2="40"/>
          </g>
          <path d="M22 68 L34 48 L42 58 L52 42 L74 68 Z" fill="#2170e4" opacity=".9"/>
          <path d="M30 68 L40 54 L46 61 L54 50 L66 68 Z" fill="#0058be"/>
          <path d="M48 12 l2.2 4.6 5 .7 -3.6 3.5 .9 5 -4.5-2.4 -4.5 2.4 .9-5 -3.6-3.5 5-.7 Z" fill="#e8d07a" transform="translate(0,-2) scale(.85)" transform-origin="48 16"/>
        </svg>
        <div style="text-align:center">
          <div class="t1">Republic of the Philippines</div>
          <div class="t2">Government HRIS</div>
        </div>
        <div class="bar"><i></i></div>
      </div>
    </div>
    <noscript>
      <div style="font-family:system-ui;padding:40px;max-width:640px;margin:auto">
        <h1>Government HRIS</h1>
        <p>JavaScript is required to run the Government Human Resource Information System. Please enable JavaScript and reload.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      setTimeout(function () {
        var b = document.getElementById("boot");
        if (b && !window.__HRIS_READY__) {
          b.innerHTML = '<div style="color:#fca5a5;font-family:system-ui;font-size:14px;padding:0 24px;text-align:center">The application is taking longer than expected to start.<br/>Please check the browser console and reload the page.</div>';
        }
      }, 9000);
    </script>
  </body>
</html>
